<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <title>Proyecto Plantas</title>
</head>

<body>
  <div class="login">
    <div class="row justify-content-end"> <!-- Empuja el contenido hacia la derecha -->
      <div class="col-md-6"> <!-- Columna derecha (50%) con texto alineado a la derecha -->
        <h1>Portal de monitoreo</h1>
        <h2>Registrarse</h2>
         <input type="text" class="form-control mb-4" placeholder="Nombre" aria-label="Username" aria-describedby="basic-addon1">
        <input type="email" class="form-control mb-4" id="mailRegistro" placeholder="Email"> 
        <input type="password" id="claveRegistro" class="form-control mb-4" aria-describedby="passwordHelpBlock" placeholder="Contraseña">
         <input type="password" id="claveRegistro2" class="form-control mb-4" aria-describedby="passwordHelpBlock" placeholder="Repetir contraseña">
        <div class="container">
          <div class="row justify-content-md-center">
          <p class="col-8">-Al menos 10 caracteres y uno especial</p>
        <button type="button" class="col-4" id="boton-registro">Registrarse</button></div>
        </div>
        <p class="mt-3">Protegido por reCAPTCHA y sujeto a la <span id="enlace-registro">Política de Privacidad y Condiciones.</span></p>
        <p class="mini-texto">¿Ya tienes una cuenta? 
          <a href="/" style="color: blue; text-decoration: underline; cursor: pointer;">Iniciar Sesion</a>
        </p>
      </div>
    </div>
  </div>
</body>


</html>
