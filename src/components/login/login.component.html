<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto Plantas</title>
</head>

<body>
  <div class="login">
    <div class="row justify-content-end"> <!-- Empuja el contenido hacia la derecha -->
      <div class="col-md-6"> <!-- Columna derecha (50%) con texto alineado a la derecha -->
        <h1>Portal de monitoreo</h1>
        <h2>Iniciar sesión</h2>
        <input type="email" class="form-control mb-2" id="mail" placeholder="Email"> {{email}}
        <input type="password" id="inputPassword" class="form-control mb-2" aria-describedby="passwordHelpBlock" placeholder="Contraseña">
        <p>¿Olvidaste tu contraseña?</p>
        <button type="button" class="btn btn-primary">Iniciar sesión</button>
        <p class="mt-3">Protegido por reCAPTCHA y sujeto a la Política de Privacidad y Condiciones.</p>
        <p>¿No tienes una cuenta? <a href="#">Registrarse</a></p>
      </div>
    </div>
  </div>
</body>


</html>
