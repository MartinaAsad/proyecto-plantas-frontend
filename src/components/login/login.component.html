  <div class="login">
    <div class="row justify-content-end"> <!-- Empuja el contenido hacia la derecha -->

          <div class="row justify-content-md-center">
          <p class="col-6">¿Olvidaste tu contraseña?</p>
        <button type="button" class="col-4" id="boton-inicio-sesion">Iniciar sesión</button></div>
        </div>
 <p class="mt-3">Protegido por reCAPTCHA y sujeto a la <span>Política de Privacidad y Condiciones.</span></p>
<p>¿No tienes una cuenta? <a href="/formRegistro" style="color: blue; text-decoration: underline; cursor: pointer;">Registrarse</a></p>
      </div>
    </div>
  </div>
